<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Australian family-owned freight forwarding, road transport, warehousing and Amazon FBA logistics." />
    <meta property="og:title" content="Phoenix Global Logistics" />
    <meta property="og:description" content="Freight, warehousing and delivery from Sydney and Melbourne." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://phoenix-logistic.vercel.app/assets/phoenix-fleet.webp" />
    <link rel="icon" type="image/png" href="/assets/phoenix-logo.png" />
    <title>Phoenix Global Logistics</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- First-visit loader with three options. ?loader=1|2|3 (or the switcher pill on previews)
         picks one; otherwise the saved choice or option 1 plays. Once per session, skipped for
         reduced motion. Static so it shows before any JavaScript bundle arrives.
         1 = counter + photo stack, 2 = consignment route + curtain reveal, 3 = cinematic + roller door. -->
    <div id="pgl-loader" aria-hidden="true">
      <style>
        #pgl-loader{position:fixed;inset:0;z-index:2147483000;background:#fff;color:#232022;font-family:'Geist Variable',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
        #pgl-loader *{box-sizing:border-box}
        /* Option 1 */
        #pgl-loader.v1{clip-path:inset(0 0 0 0);transition:clip-path .9s cubic-bezier(.76,0,.24,1)}
        #pgl-loader.v1.is-out{clip-path:inset(0 0 100% 0)}
        #pgl-loader .pl-stage{position:absolute;left:50%;top:50%;width:min(22vw,240px);aspect-ratio:4/3;translate:-50% -50%;overflow:hidden;transition:width 1s cubic-bezier(.76,0,.24,1),aspect-ratio 1s cubic-bezier(.76,0,.24,1)}
        #pgl-loader.is-open .pl-stage{width:100vw;aspect-ratio:auto;height:100vh}
        #pgl-loader .pl-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;scale:1.08}
        #pgl-loader .pl-stage img.on{opacity:1;scale:1;transition:scale 1.2s cubic-bezier(.16,1,.3,1)}
        #pgl-loader .pl-count{position:absolute;right:clamp(20px,4vw,56px);top:clamp(16px,3vw,40px);font-size:clamp(64px,11vw,168px);font-weight:500;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums;transition:opacity .4s}
        #pgl-loader .pl-count small{font-size:.28em;letter-spacing:0;vertical-align:top;margin-left:.1em;color:#e31b24}
        #pgl-loader .pl-logo{position:absolute;left:50%;bottom:clamp(20px,4vw,40px);translate:-50% 0;height:44px;transition:opacity .4s}
        #pgl-loader .pl-bar{position:absolute;left:clamp(20px,4vw,56px);top:clamp(28px,4vw,56px);width:120px;height:2px;background:#2320221a}
        #pgl-loader .pl-bar i{display:block;height:100%;width:0;background:#e31b24}
        #pgl-loader.is-open .pl-count,#pgl-loader.is-open .pl-logo,#pgl-loader.is-open .pl-bar{opacity:0}
        /* Option 2: consignment route, then the two halves slide open like curtain-sider panels */
        #pgl-loader.v2{background:transparent}
        #pgl-loader .c2{position:absolute;top:0;bottom:0;width:50.5%;background:#fff;transition:transform 1.1s cubic-bezier(.76,0,.24,1)}
        #pgl-loader .c2.l{left:0}
        #pgl-loader .c2.r{right:0}
        #pgl-loader.is-out .c2.l{box-shadow:inset -2px 0 0 #e31b24}
        #pgl-loader.is-out .c2.r{box-shadow:inset 2px 0 0 #e31b24}
        #pgl-loader.is-out .c2.l{transform:translateX(-101%)}
        #pgl-loader.is-out .c2.r{transform:translateX(101%)}
        #pgl-loader .v2-in{position:absolute;inset:0;transition:opacity .35s}
        #pgl-loader.is-open .v2-in{opacity:0}
        #pgl-loader .v2-top,#pgl-loader .v2-bot{position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8a8588}
        #pgl-loader .v2-top{top:clamp(20px,3.5vw,44px)}
        #pgl-loader .v2-bot{bottom:clamp(20px,3.5vw,44px);align-items:flex-end}
        #pgl-loader .v2-top b,#pgl-loader .v2-bot b{display:block;margin-top:6px;font-weight:500;letter-spacing:.02em;text-transform:none;font-size:15px;color:#232022;font-variant-numeric:tabular-nums}
        #pgl-loader .v2-pct{font-size:clamp(40px,6vw,72px)!important;letter-spacing:-.04em!important;line-height:.9}
        #pgl-loader .v2-pct small{font-size:.4em;color:#e31b24;vertical-align:top}
        #pgl-loader .v2-mid{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(680px,84vw);text-align:center}
        #pgl-loader .v2-mid img{height:clamp(56px,7vw,84px);margin-bottom:clamp(36px,5vw,56px)}
        #pgl-loader .v2-route{position:relative;height:2px;background:#2320221a}
        #pgl-loader .v2-route>i{position:absolute;left:0;top:0;bottom:0;width:0;background:#e31b24}
        #pgl-loader .v2-node{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;border:1.5px solid #c9c5c7;transition:border-color .3s,background .3s,scale .3s}
        #pgl-loader .v2-node.on{border-color:#e31b24;background:#e31b24;scale:1.15}
        #pgl-loader .v2-node span{position:absolute;top:20px;left:50%;translate:-50% 0;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#a29da0;transition:color .3s}
        #pgl-loader .v2-node.on span{color:#232022}
        #pgl-loader .v2-truck{position:absolute;top:50%;left:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#e31b24;box-shadow:0 0 0 6px #e31b2422}
        @media (max-width:640px){#pgl-loader .v2-node span{font-size:9px;letter-spacing:.08em}#pgl-loader .v2-top>div:last-child{text-align:right}}
        /* Option 3: cinematic photos, then the screen lifts like a roller door */
        #pgl-loader.v3{background:#0e0d0e;color:#fff;transition:transform 1.15s cubic-bezier(.76,0,.24,1)}
        #pgl-loader.v3.is-out{transform:translateY(-100%)}
        #pgl-loader .v3-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;scale:1.14;transition:opacity .9s ease,scale 3.2s cubic-bezier(.2,.6,.3,1)}
        #pgl-loader .v3-media img.on{opacity:1;scale:1}
        #pgl-loader .v3-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,9,10,.88) 0%,rgba(10,9,10,.35) 55%,rgba(10,9,10,.55) 100%)}
        #pgl-loader .v3-slats{position:absolute;inset:0;opacity:0;transition:opacity .4s;background:repeating-linear-gradient(to bottom,transparent 0 calc(10vh - 2px),rgba(255,255,255,.08) calc(10vh - 2px) 10vh)}
        #pgl-loader.is-open .v3-slats{opacity:1}
        #pgl-loader .v3-edge{position:absolute;left:0;right:0;bottom:0;height:4px;background:#e31b24;transform-origin:left;scale:0 1}
        #pgl-loader .v3-logo{position:absolute;left:clamp(20px,4vw,56px);top:clamp(18px,3vw,36px);height:clamp(48px,5vw,64px)}
        #pgl-loader .v3-loc{position:absolute;right:clamp(20px,4vw,56px);top:clamp(26px,3.5vw,44px);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffffffb3;text-align:right}
        #pgl-loader .v3-copy{position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:clamp(40px,6vw,80px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
        #pgl-loader .v3-h{margin:0;font-weight:500;font-size:clamp(38px,6.4vw,104px);line-height:.98;letter-spacing:-.04em;max-width:11.5em}
        #pgl-loader .v3-h span{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.06em}
        #pgl-loader .v3-h span i{display:inline-block;font-style:normal;translate:0 110%;transition:translate .9s cubic-bezier(.16,1,.3,1)}
        #pgl-loader .v3-h span.in i{translate:0 0}
        #pgl-loader .v3-h em{font-style:normal;color:#e31b24}
        #pgl-loader .v3-meta{flex:none;text-align:right;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ffffffb3}
        #pgl-loader .v3-meta b{display:block;font-weight:500;font-size:clamp(28px,3vw,44px);letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums;margin-bottom:6px}
        @media (max-width:640px){#pgl-loader .v3-copy{flex-direction:column;align-items:flex-start}#pgl-loader .v3-meta{text-align:left}}
        @media (prefers-reduced-motion:reduce){#pgl-loader{display:none}}
        /* Preview-only switcher */
        .pgl-switch{position:fixed;left:16px;bottom:16px;z-index:2147482000;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 14px;border-radius:999px;background:#232022;color:#fff;font:500 12px/1 'Geist Variable',system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 10px 30px rgba(0,0,0,.25)}
        .pgl-switch span{margin-right:6px;opacity:.75}
        .pgl-switch button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;text-align:center;line-height:30px;font-weight:600;color:#fff;background:#ffffff14}
        .pgl-switch button:hover{background:#ffffff2e}
        .pgl-switch button.on{background:#e31b24}
      </style>
    </div>
    <script>
      (function () {
        var el = document.getElementById('pgl-loader'), root = document.documentElement;
        var P = '/option2/photos/', q = null, v = 1;
        try { q = new URLSearchParams(location.search).get('loader'); } catch (e) {}
        try { v = +(q || localStorage.getItem('pgl-loader-v') || 1); } catch (e) { v = +(q || 1); }
        if (!(v >= 1 && v <= 3)) v = 1;
        if (q) { try { localStorage.setItem('pgl-loader-v', String(v)); } catch (e) {} }

        // Switcher pill: on previews and local builds, or whenever ?loader is in the URL.
        if (q || location.hostname !== 'phoenix-logistic.vercel.app') {
          var sw = document.createElement('div'); sw.className = 'pgl-switch';
          sw.innerHTML = '<span>Loading screen</span>' + [1, 2, 3].map(function (n) { return '<button type="button" data-n="' + n + '"' + (n === v ? ' class="on"' : '') + ' aria-label="Loading screen option ' + n + '">' + n + '</button>'; }).join('');
          sw.addEventListener('click', function (e) {
            var b = e.target.closest('button'); if (!b) return;
            var u = new URL(location.href); u.searchParams.set('loader', b.dataset.n); location.href = u.toString();
          });
          var addSw = function () { document.body.appendChild(sw); };
          document.body ? addSw() : addEventListener('DOMContentLoaded', addSw);
        }

        var skip = false;
        try { skip = !q && sessionStorage.getItem('pgl-loaded') === '1'; } catch (e) {}
        if (skip || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.remove(); return; }
        try { sessionStorage.setItem('pgl-loaded', '1'); } catch (e) {}
        root.style.overflow = 'hidden';
        el.classList.add('v' + v);
        function ease(t) { return 1 - Math.pow(1 - t, 3); }
        function finish(openMs, outMs) {
          el.classList.add('is-open');
          setTimeout(function () { el.classList.add('is-out'); root.style.overflow = ''; }, openMs);
          setTimeout(function () { el.remove(); }, openMs + outMs);
        }
        function img(src, parent) { var i = new Image(); i.alt = ''; i.decoding = 'async'; i.src = src; parent.appendChild(i); return i; }

        if (v === 1) {
          el.insertAdjacentHTML('beforeend', '<div class="pl-stage"></div><div class="pl-count"><span>0</span><small>%</small></div><div class="pl-bar"><i></i></div><img class="pl-logo" src="/assets/phoenix-logo.png" alt="" />');
          var stage = el.querySelector('.pl-stage'), num = el.querySelector('.pl-count span'), bar = el.querySelector('.pl-bar i');
          var imgs = ['drone-07', 'warehouse-45', 'rollers-05', 'warehouse-124', 'night-08', 'drone-01'].map(function (n) { return img(P + n + '@640.webp', stage); });
          imgs[imgs.length - 1].src = P + 'drone-01@1200.webp';
          var total = 2200, start = performance.now(), shown = -1;
          (function frame(now) {
            var t = Math.max(0, Math.min(1, (now - start) / total)), val = Math.round(ease(t) * 100);
            num.textContent = val; bar.style.width = val + '%';
            var k = Math.min(imgs.length - 1, Math.floor(t * imgs.length));
            if (k !== shown) { imgs.forEach(function (im, j) { im.classList.toggle('on', j === k); }); shown = k; }
            if (t < 1) return requestAnimationFrame(frame);
            finish(900, 1000);
          })(start);
        }

        if (v === 2) {
          var stops = [['Intake', 'Received at Wetherill Park'], ['Warehouse', 'Checked and stored'], ['Linehaul', 'In transit'], ['Delivered', 'Delivered on time']];
          var id = 'PGL-' + (100000 + Math.floor(Math.random() * 900000));
          el.insertAdjacentHTML('beforeend', '<div class="c2 l"></div><div class="c2 r"></div><div class="v2-in">' +
            '<div class="v2-top"><div>Consignment<b class="v2-id">PGL-000000</b></div><div>Wetherill Park, NSW<b>Phoenix Global Logistics</b></div></div>' +
            '<div class="v2-mid"><img src="/assets/phoenix-logo.png" alt="" /><div class="v2-route"><i></i>' +
            stops.map(function (s, j) { return '<div class="v2-node" style="left:' + (j / 3 * 100) + '%"><span>' + s[0] + '</span></div>'; }).join('') +
            '<div class="v2-truck"></div></div></div>' +
            '<div class="v2-bot"><div>Status<b class="v2-st">' + stops[0][1] + '</b></div><div><b class="v2-pct"><span>0</span><small>%</small></b></div></div></div>');
          var line = el.querySelector('.v2-route>i'), dot = el.querySelector('.v2-truck'), nodes = el.querySelectorAll('.v2-node');
          var idEl = el.querySelector('.v2-id'), st = el.querySelector('.v2-st'), pct = el.querySelector('.v2-pct span');
          var total2 = 2600, s2 = performance.now(), last = -1;
          (function frame(now) {
            var t = Math.max(0, Math.min(1, (now - s2) / total2)), p = ease(t);
            line.style.width = p * 100 + '%'; dot.style.left = p * 100 + '%'; pct.textContent = Math.round(p * 100);
            idEl.textContent = t < .45 ? 'PGL-' + (100000 + Math.floor(Math.random() * 900000)) : id;
            var k = Math.min(3, Math.floor(p * 3 + .02));
            if (k !== last) { for (var j = 0; j <= k; j++) nodes[j].classList.add('on'); st.textContent = stops[k][1]; last = k; }
            if (t < 1) return requestAnimationFrame(frame);
            finish(450, 1200);
          })(s2);
        }

        if (v === 3) {
          el.insertAdjacentHTML('beforeend', '<div class="v3-media"></div><div class="v3-shade"></div><div class="v3-slats"></div>' +
            '<img class="v3-logo" src="/assets/phoenix-logo-light.png" alt="" />' +
            '<div class="v3-loc">Wetherill Park, NSW<br />Australia-wide</div>' +
            '<div class="v3-copy"><h2 class="v3-h"></h2><div class="v3-meta"><b class="v3-n">01 / 03</b><span class="v3-cap">Warehousing</span></div></div><div class="v3-edge"></div>');
          var media = el.querySelector('.v3-media'), h = el.querySelector('.v3-h'), n3 = el.querySelector('.v3-n'), cap = el.querySelector('.v3-cap'), edge = el.querySelector('.v3-edge');
          var scenes = [['warehouse-45', 'Warehousing'], ['night-08', 'Linehaul'], ['drone-01', 'Distribution']];
          var pics = scenes.map(function (s) { return img(P + s[0] + '@1200.webp', media); });
          var words = 'The Logistics Behind Australian Business.'.split(' ');
          h.innerHTML = words.map(function (w) { return '<span><i>' + w + '</i></span>'; }).join(' ');
          h.lastElementChild.firstChild.innerHTML = 'Business<em>.</em>';
          var spans = h.querySelectorAll('span');
          spans.forEach(function (s, j) { setTimeout(function () { s.classList.add('in'); }, 250 + j * 110); });
          var total3 = 3000, s3 = performance.now(), cur = -1;
          (function frame(now) {
            var t = Math.max(0, Math.min(1, (now - s3) / total3));
            edge.style.scale = t + ' 1';
            var k = Math.min(2, Math.floor(t * 3));
            if (k !== cur) { pics.forEach(function (im, j) { im.classList.toggle('on', j === k); }); n3.textContent = '0' + (k + 1) + ' / 03'; cap.textContent = scenes[k][1]; cur = k; }
            if (t < 1) return requestAnimationFrame(frame);
            finish(350, 1200);
          })(s3);
        }
      })();
    </script>
    <script type="module" src="/prototypes/phoenix/main.jsx"></script>
  </body>
</html>
